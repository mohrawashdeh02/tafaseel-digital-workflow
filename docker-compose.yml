services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tafaseel
      POSTGRES_USER: tafaseel
      POSTGRES_PASSWORD: tafaseel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tafaseel -d tafaseel"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
